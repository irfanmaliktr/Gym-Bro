  </head><body class="bg-bg-canvas text-text-primary min-h-screen flex flex-col font-body-md text-body-md selection:bg-accent-neon selection:text-text-on-accent pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-bg-canvas px-margin"><div class="flex flex-col w-full max-w-md mx-auto items-center justify-center py-6 px-1">
<!-- Subtle decorative ambient neon pulse behind header -->
<div class="relative w-full flex flex-col items-center">
<!-- Gymbro Brand Wordmark -->
<div class="flex items-baseline gap-1 mb-2">
<span class="font-display-mobile text-display-mobile tracking-tight text-text-primary uppercase font-extrabold select-none">gymbro</span>
<span class="w-2.5 h-2.5 rounded-full bg-accent-neon shadow-lg shadow-accent-neon/30 animate-pulse"></span>
</div>
<!-- Onboarding Headings -->
<h1 class="font-display text-display text-text-primary text-center tracking-tight mb-2">
      Welcome to gymbro
    </h1>
<p class="font-body-md text-body-md text-text-secondary text-center max-w-xs mb-8">
      Minimalist, local-first workout logging.
    </p>
<!-- Elevated Central Setup Card -->
<div class="w-full bg-surface-card rounded-xl p-5 md:p-6 shadow-2xl relative overflow-hidden flex flex-col gap-6">
<!-- Glow detail bar at card top edge -->
<div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-accent-neon to-transparent opacity-80"></div>
<!-- Field 1: Display Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-secondary flex items-center justify-between" for="displayName">
<span>Display Name <span class="text-text-muted text-label-sm font-normal">(Optional)</span></span>
<span class="material-symbols-outlined text-text-muted text-base">badge</span>
</label>
<div class="relative flex items-center">
<input autocomplete="name" class="w-full bg-bg-canvas text-text-primary placeholder:text-text-muted font-body-md text-body-md px-4 py-3.5 rounded-lg focus:outline-none focus:bg-surface-elevated transition-colors duration-200" id="displayName" name="displayName" placeholder="e.g. Alex" type="text">
</div>
</div>
<!-- Field 2: Preferred Language Segmented Toggle -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-secondary flex items-center justify-between">
<span>Preferred Language</span>
<span class="material-symbols-outlined text-text-muted text-base">translate</span>
</label>
<div aria-label="Preferred Language" class="grid grid-cols-2 p-1 bg-bg-canvas rounded-lg gap-1.5" role="radiogroup">
<button aria-checked="true" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm" id="lang-en" onclick="setLanguage('en')" role="radio" type="button">
<span class="material-symbols-outlined text-sm font-bold">check</span>
<span class="font-body-bold">English</span>
</button>
<button aria-checked="false" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary" id="lang-id" onclick="setLanguage('id')" role="radio" type="button">
<span class="font-body-bold">Bahasa Indonesia</span>
</button>
</div>
</div>
<!-- Field 3: Preferred Unit Segmented Toggle -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-secondary flex items-center justify-between">
<span>Preferred Unit</span>
<span class="material-symbols-outlined text-text-muted text-base">fitness_center</span>
</label>
<div aria-label="Preferred Unit" class="grid grid-cols-2 p-1 bg-bg-canvas rounded-lg gap-1.5" role="radiogroup">
<button aria-checked="true" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm" id="unit-kg" onclick="setUnit('kg')" role="radio" type="button">
<span class="material-symbols-outlined text-sm font-bold">check</span>
<span class="font-body-bold">Kilograms (kg)</span>
</button>
<button aria-checked="false" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary" id="unit-lbs" onclick="setUnit('lbs')" role="radio" type="button">
<span class="font-body-bold">Pounds (lbs)</span>
</button>
</div>
</div>
<!-- Quick Benefit Micro-Feature list -->
<div class="bg-surface-elevated rounded-lg p-3 flex items-center justify-around text-text-secondary mt-1">
<div class="flex items-center gap-1.5 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-accent-neon text-sm">bolt</span>
<span>Zero Lag</span>
</div>
<div class="w-1 h-1 rounded-full bg-surface-container-high"></div>
<div class="flex items-center gap-1.5 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-accent-neon text-sm">wifi_off</span>
<span>100% Offline</span>
</div>
<div class="w-1 h-1 rounded-full bg-surface-container-high"></div>
<div class="flex items-center gap-1.5 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-accent-neon text-sm">shield</span>
<span>Private</span>
</div>
</div>
<!-- Primary Action CTA -->
<div class="flex flex-col gap-3 pt-2">
<button class="w-full bg-accent-neon hover:bg-accent-neon-hover active:scale-[0.98] text-text-on-accent font-body-bold text-title-sm min-h-[48px] py-3.5 px-6 rounded-lg flex items-center justify-center gap-2 transition-all duration-150 shadow-lg shadow-accent-neon/15 cursor-pointer" id="btn-submit" onclick="handleCompleteOnboarding()" type="button">
<span>Start Workout Tracking</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Secondary Link -->
<button class="w-full py-2.5 text-center font-label-md text-label-md text-text-muted hover:text-text-secondary transition-colors duration-150 cursor-pointer" onclick="handleSkip()" type="button">
          Skip &amp; Go to Dashboard
        </button>
</div>
</div>
<!-- Micro Privacy Badge -->
<div class="mt-6 flex items-center gap-2 text-text-muted font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm">lock</span>
<span>Data stored entirely on this device</span>
</div>
</div>
</div>
<script>
  let selectedLang = 'en';
  let selectedUnit = 'kg';

  function setLanguage(lang) {
    selectedLang = lang;
    const btnEn = document.getElementById('lang-en');
    const btnId = document.getElementById('lang-id');

    if (lang === 'en') {
      btnEn.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm";
      btnEn.innerHTML = '<span class="material-symbols-outlined text-sm font-bold">check</span><span class="font-body-bold">English</span>';
      btnEn.setAttribute('aria-checked', 'true');

      btnId.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary";
      btnId.innerHTML = '<span class="font-body-bold">Bahasa Indonesia</span>';
      btnId.setAttribute('aria-checked', 'false');
    } else {
      btnId.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm";
      btnId.innerHTML = '<span class="material-symbols-outlined text-sm font-bold">check</span><span class="font-body-bold">Bahasa Indonesia</span>';
      btnId.setAttribute('aria-checked', 'true');

      btnEn.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary";
      btnEn.innerHTML = '<span class="font-body-bold">English</span>';
      btnEn.setAttribute('aria-checked', 'false');
    }
  }

  function setUnit(unit) {
    selectedUnit = unit;
    const btnKg = document.getElementById('unit-kg');
    const btnLbs = document.getElementById('unit-lbs');

    if (unit === 'kg') {
      btnKg.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm";
      btnKg.innerHTML = '<span class="material-symbols-outlined text-sm font-bold">check</span><span class="font-body-bold">Kilograms (kg)</span>';
      btnKg.setAttribute('aria-checked', 'true');

      btnLbs.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary";
      btnLbs.innerHTML = '<span class="font-body-bold">Pounds (lbs)</span>';
      btnLbs.setAttribute('aria-checked', 'false');
    } else {
      btnLbs.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-elevated text-accent-neon shadow-sm";
      btnLbs.innerHTML = '<span class="material-symbols-outlined text-sm font-bold">check</span><span class="font-body-bold">Pounds (lbs)</span>';
      btnLbs.setAttribute('aria-checked', 'true');

      btnKg.className = "flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-secondary";
      btnKg.innerHTML = '<span class="font-body-bold">Kilograms (kg)</span>';
      btnKg.setAttribute('aria-checked', 'false');
    }
  }

  function handleCompleteOnboarding() {
    const inputVal = document.getElementById('displayName').value.trim();
    const btn = document.getElementById('btn-submit');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>Preparing Gym Floor...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-xl">done_all</span><span>Let\'s Lift!</span>';
    }, 400);
  }

  function handleSkip() {
    const btn = document.getElementById('btn-submit');
    btn.innerHTML = '<span class="material-symbols-outlined text-xl">fast_forward</span><span>Loading Dashboard...</span>';
  }
</script></main></body></html>
